<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    Alias /client /var/www/html/hotel

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
        </IfModule>
    </Directory>

    <Directory /var/www/html/hotel>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # WebSocket Reverse Proxy to Arcturus Morningstar
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/?(.*) ws://nitro-emulator:2096/$1 [P,L]

    ProxyPass /ws/ ws://nitro-emulator:2096/
    ProxyPassReverse /ws/ ws://nitro-emulator:2096/
    ProxyPass /ws ws://nitro-emulator:2096/
    ProxyPassReverse /ws ws://nitro-emulator:2096/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
