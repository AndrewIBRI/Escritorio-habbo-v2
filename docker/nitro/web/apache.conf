<VirtualHost *:80 *:8064>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    UseCanonicalName Off
    UseCanonicalPhysicalPort Off

    # Explicit Aliases for Nitro HTML5 Client
    Alias /hotel /var/www/html/hotel
    Alias /assets /var/www/html/hotel/assets
    Alias /bundled /var/www/html/hotel/bundled
    Alias /gamedata /var/www/html/hotel/gamedata
    Alias /images /var/www/html/hotel/images
    Alias /logos /var/www/html/hotel/logos
    Alias /sounds /var/www/html/hotel/sounds
    Alias /src /var/www/html/hotel/src
    Alias /renderer-config.json /var/www/html/hotel/renderer-config.json
    Alias /ui-config.json /var/www/html/hotel/ui-config.json

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
        </IfModule>
    </Directory>

    <Directory /var/www/html/hotel>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
        </IfModule>
    </Directory>

    RewriteEngine On

    # Redirect /client or /client/ directly to SSO launcher
    RewriteRule ^/client/?$ /client.php [R=302,L]

    # WebSocket Reverse Proxy to Arcturus Morningstar NitroWebsockets plugin
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/?(.*) ws://nitro-emulator:2096/$1 [P,L]

    ProxyPass /ws/ ws://nitro-emulator:2096/
    ProxyPassReverse /ws/ ws://nitro-emulator:2096/
    ProxyPass /ws ws://nitro-emulator:2096/
    ProxyPassReverse /ws ws://nitro-emulator:2096/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
