services:
  nitro-db:
    image: mariadb:10.6
    container_name: habbo-nitro-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode="" --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-HabboRoot_9csibYIFT59PrBPOfLxZmYTu}
      MYSQL_DATABASE: arcturus
      MYSQL_USER: ${MYSQL_USER:-arcturus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HabboUser_0kh9qhJkhYI0Klk444U45VjA}
    ports:
      - "${PORT_NITRO_DB:-33067}:3306"
    volumes:
      - ./docker/nitro/sql:/docker-entrypoint-initdb.d:ro
      - nitro-db-data:/var/lib/mysql

  nitro-emulator:
    build:
      context: .
      dockerfile: docker/nitro/emulator/Dockerfile
    container_name: habbo-nitro-emulator
    restart: unless-stopped
    environment:
      DB_HOST: nitro-db
      DB_PORT: 3306
      DB_USER: arcturus_user
      DB_PASS: ${MYSQL_PASSWORD:-HabboUser_0kh9qhJkhYI0Klk444U45VjA}
      DB_NAME: arcturus
    ports:
      - "${PORT_NITRO_GAME:-38100}:3000"
      - "${PORT_NITRO_RCON:-38101}:3001"
      - "${PORT_NITRO_WS:-38196}:2096"
    depends_on:
      - nitro-db

  nitro-web:
    build:
      context: .
      dockerfile: docker/nitro/web/Dockerfile
    container_name: habbo-nitro-web
    restart: unless-stopped
    environment:
      DB_HOST: nitro-db
      DB_PORT: 3306
      DB_USER: arcturus_user
      DB_PASS: ${MYSQL_PASSWORD:-HabboUser_0kh9qhJkhYI0Klk444U45VjA}
      DB_NAME: arcturus
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-server-flow-hotel.00behz.easypanel.host}
      WS_PROTOCOL: ${WS_PROTOCOL:-wss}
      HTTP_PROTOCOL: ${HTTP_PROTOCOL:-https}
    ports:
      - "${PORT_NITRO_WEB:-8064}:8064"
    depends_on:
      - nitro-db
      - nitro-emulator
      - r63c-web
    networks:
      default:
        aliases:
          - server_flow-hotel
          - flow-hotel
          - nitro-web
          - habbo-nitro-web

  # Automatic decommission of legacy r63c containers to release port 8064 and RAM
  r63c-web:
    image: alpine:latest
    container_name: habbo-r63c-web
    command: ["true"]
    restart: "no"

  r63c-emulator:
    image: alpine:latest
    container_name: habbo-r63c-emulator
    command: ["true"]
    restart: "no"

  r63c-db:
    image: alpine:latest
    container_name: habbo-r63c-db
    command: ["true"]
    restart: "no"

volumes:
  nitro-db-data:
