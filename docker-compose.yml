# ==============================================================================
# Habbo 6-in-1 Retro Suite - Unified Docker Compose Configuration
# ==============================================================================
# Usage with Profiles:
#   docker compose --profile v14 up -d         # Run only 2007 (v14 Kepler)
#   docker compose --profile v31 up -d         # Run only 2009 (v31 Havana)
#   docker compose --profile r63a up -d        # Run only 2011 (r63a Gold Tree)
#   docker compose --profile r63b up -d        # Run only 2012 (r63b Atom/Butter)
#   docker compose --profile r63b-swift up -d  # Run only 2013-14 (r63b Swift)
#   docker compose --profile r63c up -d        # Run only 2015-17 (r63c PlusEMU)
#   docker compose --profile all up -d         # Run ALL 6 retros concurrently
#
# Standalone Compose files are also available:
#   docker compose -f docker-compose.v14.yml up -d
#   docker compose -f docker-compose.v31.yml up -d
#   docker compose -f docker-compose.r63a.yml up -d
#   docker compose -f docker-compose.r63b.yml up -d
#   docker compose -f docker-compose.r63b-swift.yml up -d
#   docker compose -f docker-compose.r63c.yml up -d
# ==============================================================================

services:
  # ============================================================================
  # 1. RETRO 2007 - v14 (Kepler Java Emulator + Shockwave DCR Web Client)
  # ============================================================================
  v14-db:
    profiles: ["v14", "all"]
    image: mariadb:11
    container_name: habbo-v14-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-habboroot}
      MYSQL_DATABASE: ${DB_NAME_V14:-v14}
      MYSQL_USER: ${MYSQL_USER:-habbo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-habbopass}
    volumes:
      - v14_db_data:/var/lib/mysql
      - ./docker/v14/sql/v14.sql:/docker-entrypoint-initdb.d/01_v14.sql:ro
    ports:
      - "${PORT_V14_DB:-33061}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - habbo-v14-net

  v14-emulator:
    profiles: ["v14", "all"]
    build:
      context: .
      dockerfile: docker/v14/emulator/Dockerfile
    container_name: habbo-v14-emulator
    restart: unless-stopped
    environment:
      DB_HOST: v14-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-habboroot}
      DB_NAME: ${DB_NAME_V14:-v14}
      PORT_V14_GAME: ${PORT_V14_GAME:-12321}
      PORT_V14_MUS: ${PORT_V14_MUS:-12322}
      PORT_V14_RCON: ${PORT_V14_RCON:-12309}
    ports:
      - "${PORT_V14_GAME:-12321}:12321"
      - "${PORT_V14_MUS:-12322}:12322"
      - "${PORT_V14_RCON:-12309}:12309"
    depends_on:
      v14-db:
        condition: service_healthy
    networks:
      - habbo-v14-net

  v14-web:
    profiles: ["v14", "all"]
    build:
      context: .
      dockerfile: docker/v14/web/Dockerfile
    container_name: habbo-v14-web
    restart: unless-stopped
    environment:
      HOST_IP: ${HOST_IP:-127.0.0.1}
      PORT_V14_GAME: ${PORT_V14_GAME:-12321}
      PORT_V14_MUS: ${PORT_V14_MUS:-12322}
    ports:
      - "${PORT_V14_WEB:-8014}:80"
    networks:
      - habbo-v14-net

  # ============================================================================
  # 2. RETRO 2009 - v31 (Havana Java Emulator + Web Server + Flash/DCR Client)
  # ============================================================================
  v31-db:
    profiles: ["v31", "all"]
    image: mariadb:11
