      HOST_IP: ${HOST_IP:-127.0.0.1}
      PORT_R63C_WEB: ${PORT_R63C_WEB:-8064}
      PORT_R63C_GAME: ${PORT_R63C_GAME:-30300}
      PORT_R63C_MUS: ${PORT_R63C_MUS:-30301}
    ports:
      - "${PORT_R63C_WEB:-8064}:80"
    depends_on:
      - r63c-db
    networks:
      habbo-r63c-net:
        aliases:
          - server_flow-hotel
          - flow-hotel
          - r63c-web
          - habbo-r63c-web

# ==============================================================================
# NETWORKS - Isolated Bridge Network per Retro (Zero Interference)
# ==============================================================================
networks:
  habbo-v14-net:
    driver: bridge
  habbo-v31-net:
    driver: bridge
  habbo-r63a-net:
    driver: bridge
  habbo-r63b-net:
    driver: bridge
  habbo-r63b-swift-net:
    driver: bridge
  habbo-r63c-net:
    driver: bridge

# ==============================================================================
# VOLUMES - Persistent Database Storage
# ==============================================================================
volumes:
  v14_db_data:
  v31_db_data:
  r63a-db-data:
  r63b-db-data:
  r63b-swift-db-data:
  r63c-db-data:
