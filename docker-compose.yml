    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-habboroot}
      MYSQL_DATABASE: ${DB_NAME_V31:-v31}
      MYSQL_USER: ${MYSQL_USER:-habbo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-habbopass}
    volumes:
      - v31_db_data:/var/lib/mysql
      - ./docker/v31/sql/v31.sql:/docker-entrypoint-initdb.d/01_v31.sql:ro
    ports:
      - "${PORT_V31_DB:-33062}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - habbo-v31-net

  v31-emulator:
    profiles: ["v31", "all"]
    build:
      context: .
      dockerfile: docker/v31/server/Dockerfile
    container_name: habbo-v31-emulator
    restart: unless-stopped
    environment:
      DB_HOST: v31-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-habboroot}
      DB_NAME: ${DB_NAME_V31:-v31}
      PORT_V31_GAME: ${PORT_V31_GAME:-12331}
      PORT_V31_MUS: ${PORT_V31_MUS:-12332}
      PORT_V31_RCON: ${PORT_V31_RCON:-12319}
    ports:
      - "${PORT_V31_GAME:-12331}:12331"
      - "${PORT_V31_MUS:-12332}:12332"
      - "${PORT_V31_RCON:-12319}:12319"
    depends_on:
      v31-db:
        condition: service_healthy
    networks:
      - habbo-v31-net

  v31-web:
    profiles: ["v31", "all"]
    build:
      context: .
      dockerfile: docker/v31/web/Dockerfile
    container_name: habbo-v31-web
    restart: unless-stopped
    environment:
      HOST_IP: ${HOST_IP:-127.0.0.1}
      PORT_V31_WEB: ${PORT_V31_WEB:-8031}
      PORT_V31_GAME: ${PORT_V31_GAME:-12331}
      PORT_V31_MUS: ${PORT_V31_MUS:-12332}
      PORT_V31_RCON: ${PORT_V31_RCON:-12319}
      DB_HOST: v31-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-habboroot}
      DB_NAME: ${DB_NAME_V31:-v31}
    ports:
      - "${PORT_V31_WEB:-8031}:80"
    depends_on:
      v31-db:
        condition: service_healthy
      v31-emulator:
        condition: service_started
    networks:
      - habbo-v31-net

  # ============================================================================
  # 3. RETRO 2011 - r63a (Gold Tree Emulator + HobbaCMS + Flash Client)
